name: Checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Public browser checks (no credentials)
        run: npx playwright test
      - name: Build mocked admin app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-test-key
      - name: Admin browser checks (mocked requests)
        run: npx playwright test tests/e2e/batch-hazards.spec.ts tests/e2e/shelter-admin.spec.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-test-key
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-results
          path: test-results/
